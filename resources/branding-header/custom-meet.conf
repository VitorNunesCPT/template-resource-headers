# Serve the generated branding assets stored in /config/branding.
location ^~ /branding/ {
    alias /config/branding/;
    add_header Cache-Control "no-store";
}

# Use the fousp logo as the browser favicon.
location = /images/favicon.svg {
    alias /config/branding/fousp.svg;
    add_header Cache-Control "no-store";
}

location = /favicon.ico {
    types {
        image/svg+xml ico;
    }
    alias /config/branding/fousp.svg;
    add_header Cache-Control "no-store";
}

# Inject header CSS/JS in the base HTML response.
sub_filter_once on;
sub_filter '</head>' '<link rel="stylesheet" href="/branding/header.css?v=2"><link rel="stylesheet" href="/branding/welcome.css?v=2"></head>';
sub_filter '</body>' '<script src="/branding/header.js?v=2"></script><script src="/branding/welcome.js?v=2"></script></body>';
